# main ブランチへ push するたびに、ビルドして GitHub Pages へ公開する。
# 公開 URL: https://oshun5292.github.io/my_travel_app/

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # Actions タブから手動でも実行できる

# GITHUB_TOKEN に与える権限は、Pages への公開に必要な分だけにする。
permissions:
  contents: read
  pages: write
  id-token: write

# 公開が重なったときは、古い実行を取り消す。
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # リポジトリの Settings > Secrets and variables > Actions に登録した値を、ビルド時だけ渡す。
          VITE_CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
